[project]
name = "ai-coding"
version = "0.1.0"
description = "Records small functions in daily life, managed with uv; investigates AI coding tools"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "streamlit>=1.55.0",
    "xlsxwriter>=3.2.9",
    "pymupdf>=1.26.0",
    "openai>=1.100.0",
    "tiktoken>=0.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.1.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pydantic>=2.13.3",
    "polars>=1.44.2",
    "pyarrow>=23.0.1",
    "websockets>=17.1",
    "pillow>=12.1.1",
    "pillow-heif>=1.8.0",
    "numpy>=2.1",
    "click>=8.3.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# OCR 拆成三块、均可独立安装：`ocr` 是 Python 前端栈（paddleocr[doc-parser]），
# 引擎按平台二选一。组合用法：
#   CPU: uv sync --extra ocr --extra paddle-cpu
#   GPU: uv sync --extra ocr --extra paddle-gpu
ocr = [
    "paddleocr[doc-parser]>=3.7.0",
    "huggingface_hub>=1.0",   # `ocr-backend download` 拉模型快照
]
paddle-cpu = [
    "paddlepaddle>=3.2.0; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
]
# PyPI 上 paddlepaddle-gpu 停在 2.6.2（与 paddlex 3.x 不兼容，跑 OCR 直接 AttributeError），
# 因此 GPU 引擎改由 Paddle 官方源解析，见下方 [[tool.uv.index]] + [tool.uv.sources]。
paddle-gpu = [
    "paddlepaddle-gpu>=3.2.1; (platform_machine == 'AMD64' or platform_machine == 'x86_64') and sys_platform != 'darwin'",
]

[project.scripts]
pdf-summarize = "pdf_summarizer.cli:cli"
ai-market-radar = "ai_market_radar.cli:cli"
file-manager = "file_manager.cli:cli"
research-agent = "research_agent.cli:cli"
ocr-backend = "ocr_backend.cli:cli"
ocr-review = "ocr_review.cli:cli"
rag = "rag.cli:cli"
skills = "skill_manager.cli:cli"
orchestrate = "orchestrator.cli:cli"
quant = "quantdesk.cli:cli"
photos = "photo_desk.cli:cli"
notify = "notify.cli:cli"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "mypy>=1.19",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding", "src/modules", "src/pdf_summarizer", "src/utils", "src/ai_market_radar", "src/file_manager", "src/llm_client", "src/ocr_backend", "src/ocr_review", "src/task_queue", "src/research_agent", "src/storage", "src/rag", "src/skill_manager", "src/orchestrator", "src/quantdesk", "src/photo_desk", "src/notify"]

[tool.uv]
package = true

# GPU 引擎的官方源（PyPI 上没有可用的 3.x 轮子）。explicit = true 表示该源只对
# [tool.uv.sources] 里指到它的包生效；换 CUDA 通道只改 URL（当前为本机 RTX 3070 Ti / cu126）。
[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

# Third-party libs without (usable) type information: paddleocr only exists
# when an OCR extra is installed, the rest ship no py.typed marker. Checking
# our code against a full env and against the CI hook must give the same list.
[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "paddlex.*",
    "paddle",
    "huggingface_hub",
    "fitz",
    "pandas.*",
    "openpyxl.*",
    "markdownify.*",
    "feedparser.*",
    "ruamel.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
