[project]
name = "ai-coding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "streamlit>=1.55.0",
    "xlsxwriter>=3.2.9",
    "pymupdf>=1.26.0",
    "openai>=1.100.0",
    "tiktoken>=0.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.1.0",
]

[project.scripts]
pdf-summarize = "pdf_summarizer.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding", "src/config", "src/modules", "src/pdf_summarizer", "src/utils"]

[tool.uv]
package = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
