[project]
name = "ai-coding"
version = "0.1.0"
description = "Records small functions in daily life, managed with uv; investigates AI coding tools"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "streamlit>=1.55.0",
    "xlsxwriter>=3.2.9",
    "pymupdf>=1.26.0",
    "openai>=1.100.0",
    "tiktoken>=0.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.1.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ocr = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.2.0; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
    "pdf2image>=1.17.0",
]
ocr-gpu = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle-gpu>=2.6.2; (platform_machine == 'AMD64' or platform_machine == 'x86_64') and sys_platform != 'darwin'",
    "pdf2image>=1.17.0",
]

[project.scripts]
pdf-summarize = "pdf_summarizer.cli:main"
ai-market-radar = "ai_market_radar.cli:main"
file-manager = "file_manager.cli:main"
research-agent = "research_agent.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding", "src/modules", "src/pdf_summarizer", "src/utils", "src/ai_market_radar", "src/file_manager", "src/llm_client", "src/research_agent", "src/storage"]

[tool.uv]
package = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
