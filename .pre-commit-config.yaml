repos:
  # Updated pre-commit-hooks to latest version v6.0.0
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        # Added file restriction to speed up
        files: \.py$
        # Added target version to fix Python 3.12 compatibility
        args: [--target-version=py312]
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Added file restriction to speed up
        files: \.py$
        # Increased max line length to 100 (common modern standard)
        # Extended ignore to include E203 (conflicts with black formatter)
        args: [--max-line-length=100, --extend-ignore=E203]
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        files: \.py$
        args: ["--profile", "black"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: \.py$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: \.py$
        args: ["--skip", "B101", "--exclude", "tests"]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
