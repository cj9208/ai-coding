repos:
  # Updated pre-commit-hooks to latest version v6.0.0
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        # Added file restriction to speed up
        files: \.py$
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Added file restriction to speed up
        files: \.py$
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        # Added file restriction to speed up
        files: \.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        # Optional: run only on push to reduce commit time
        stages: [push]
        files: \.py$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Optional: run only on push to reduce commit time
        stages: [push]
        files: \.py$
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
