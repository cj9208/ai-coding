# Formatters/linters run as *local* hooks off the project venv (dev group):
# one pinned version in uv.lock, so the hook, the editor and `uv run black`
# can never disagree about style. Version bumps = edit pyproject + uv lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # pre-commit batches files into parallel mypy processes sharing one
        # .mypy_cache — that race crashes CI intermittently (INTERNAL ERROR,
        # seen 2026-09-23 on ubuntu-latest, same tree green on rerun-able runs)
        require_serial: true
      - id: bandit
        name: bandit
        entry: uv run bandit --skip B101 --exclude tests
        language: system
        types: [python]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
