name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Install locked environment (default + dev, no OCR extras)
        run: uv sync --locked
      - name: Pre-commit hooks (whitespace, black, flake8, isort, mypy, bandit)
        run: uv run pre-commit run --all-files
      - name: Tests (live LLM/OCR tests self-skip without env vars)
        run: uv run pytest
